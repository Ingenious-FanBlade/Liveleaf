                - code [ref=e369]: "from heapq import heappop, heappush from itertools import count from math import isfinite def dijkstra(graph, start): for adjacent in graph.values(): for weight in adjacent.values(): if type(weight) not in (int, float) or weight < 0: raise ValueError(\"Dijkstra 需要非负的数值边权\") if type(weight) is float and not isfinite(weight): raise ValueError(\"边权必须是有限数值\") nodes = dict.fromkeys(graph) for adjacent in graph.values(): for node in adjacent: nodes.setdefault(node, None) if start not in nodes: raise ValueError(\"起点必须在图中\") node_states = { node: {\"node\": node, \"distance\": float(\"inf\"), \"visited\": False, \"predecessor\": None} for node in nodes } table_rows = list(node_states.values()) current = neighbor = None node_states[start][\"distance\"] = 0 order = count() heap = [(0, next(order), start)] while heap: best, _, current = heappop(heap) if node_states[current][\"visited\"]: continue node_states[current][\"visited\"] = True for neighbor, weight in graph.get(current, {}).items(): if node_states[neighbor][\"visited\"]: continue candidate = best + weight if candidate < node_states[neighbor][\"distance\"]: node_states[neighbor][\"distance\"] = candidate node_states[neighbor][\"predecessor\"] = current heappush(heap, (candidate, next(order), neighbor)) return ({node: state[\"distance\"] for node, state in node_states.items()}, {node: state[\"predecessor\"] for node, state in node_states.items()}) graph = { \"A\": {\"B\": 4, \"C\": 1}, \"B\": {\"D\": 1, \"E\": 7}, \"C\": {\"B\": 2, \"D\": 5}, \"D\": {\"E\": 3}, \"E\": {\"F\": 1}, \"F\": {\"C\": 2}, \"G\": {}, } distances, previous = dijkstra(graph, \"A\") for node, distance in distances.items(): print(f\"A → {node}: {distance}\") path = [] node = \"F\" while node is not None: path.append(node) node = previous[node] print(\"到 F 的路径:\", \" → \".join(reversed(path)))"
